
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande envoyée — Nectivate</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #080b14;
            color: #f4f5ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 600px;
            padding: 48px 32px;
            background: #101522;
            border: 1px solid #292f40;
            border-radius: 20px;
            box-sizing: border-box;
        }

        .check {
            width: 68px;
            height: 68px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #5ce8d8;
            color: #080b14;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            font-size: clamp(30px, 5vw, 42px);
            line-height: 1.2;
        }

        .accent {
            color: #5ce8d8;
        }

        p {
            color: #aab3c8;
            line-height: 1.8;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 22px;
            border-radius: 9px;
            background: #5ce8d8;
            color: #080b14;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="check">✓</div>

        <h1>Merci pour votre <span class="accent">demande !</span></h1>

        <p>
            Votre demande a bien été enregistrée.
            Notre équipe pourra étudier votre projet et vous recontacter
            à partir des coordonnées que vous avez indiquées.
        </p>

        <a href="/vitrine/nectivate/">Retour au site Nectivate</a>
    </main>
</body>
</html>
